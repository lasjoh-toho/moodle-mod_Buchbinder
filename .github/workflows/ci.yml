# Checks and tests with moodle-plugin-ci on every push and pull request.
# Also called by the release workflow before a release is published.
name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test
        type: string
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            moodle-branch: 'MOODLE_404_STABLE'
          - php: '8.3'
            moodle-branch: 'MOODLE_404_STABLE'
          - php: '8.3'
            moodle-branch: 'MOODLE_405_STABLE'
          - php: '8.4'
            moodle-branch: 'MOODLE_500_STABLE'

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin
          ref: ${{ inputs.ref }}

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, zip, pgsql, intl, mbstring, soap, xmlrpc
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle ${{ matrix.moodle-branch }} with the plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle coding style
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: PHPDoc
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Plugin structure
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache templates
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: JavaScript lint and up-to-date builds
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

  # After a green run on a branch: make sure the releases get the ZIP of the version in version.php.
  #  - A release "v<release>" (e.g. created in the GitHub web interface) without ZIP gets it attached.
  #  - A release with the tag "latest" gets the ZIP if it lacks it; on the default branch it is kept up to date.
  #  - On the default branch a missing "v<release>" release is created (bump version.php + merge = release).
  release-zip:
    name: Release ZIP
    needs: test
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Attach or publish the ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          RELEASE=$(.github/scripts/release.sh field release)
          TAG="v${RELEASE}"
          ZIPNAME="mod_buchbinder_${RELEASE}.zip"
          ZIP=$(.github/scripts/release.sh build)
          ONDEFAULT=false
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            ONDEFAULT=true
          fi

          has_zip() {
            gh release view "$1" --json assets -q '.assets[].name' | grep -qxF "$ZIPNAME"
          }

          # Version release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            if has_zip "$TAG"; then
              echo "Release $TAG already has $ZIPNAME."
            else
              gh release upload "$TAG" "$ZIP" --clobber
              echo "::notice::Attached $ZIPNAME to release $TAG."
            fi
          elif [ "$ONDEFAULT" = true ]; then
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::warning::Tag $TAG exists without release; publish it via the Release workflow."
            else
              .github/scripts/release.sh notes > dist/notes.md
              PRERELEASE=""
              if [ "$(.github/scripts/release.sh field maturity)" != "MATURITY_STABLE" ]; then
                PRERELEASE="--prerelease"
              fi
              gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "Buchbinder $TAG" \
                --notes-file dist/notes.md $PRERELEASE
              echo "::notice::Published release $TAG."
            fi
          else
            echo "No release $TAG; releases are created from $DEFAULT_BRANCH, via the Release workflow or the web interface."
          fi

          # Rolling "latest" release.
          if gh release view latest >/dev/null 2>&1; then
            if has_zip latest && [ "$ONDEFAULT" != true ]; then
              echo "Release latest already has $ZIPNAME."
            else
              for old in $(gh release view latest --json assets -q '.assets[].name' | grep '^mod_buchbinder_.*\.zip$' || true); do
                [ "$old" = "$ZIPNAME" ] || gh release delete-asset latest "$old" --yes
              done
              gh release upload latest "$ZIP" --clobber
              echo "::notice::Attached $ZIPNAME to release latest."
            fi
          fi
